spring:
  application:
    name: nextalloc-backend
  datasource:
    url: jdbc:h2:mem:nextalloc;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    baseline-on-migrate: false
    baseline-version: 1
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  jackson:
    serialization:
      fail-on-empty-beans: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,image/svg+xml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

nextalloc:
  jwt:
    # Demo-only fallback secret; can be overridden via NEXTALLOC_JWT_SECRET or PRAGATI_JWT_SECRET in production.
    secret: ${NEXTALLOC_JWT_SECRET:${PRAGATI_JWT_SECRET:nextalloc-sih25033-demo-signing-secret-0123456789abcdef}}
    expiry-minutes: 720
  ai:
    service-url: ${NEXTALLOC_AI_URL:${PRAGATI_AI_URL:http://127.0.0.1:8000}}
    timeout-seconds: 30
  optimizer:
    timeout-seconds: 180
    max-wall-seconds: 120
  web:
    static-dir: ${NEXTALLOC_STATIC_DIR:${PRAGATI_STATIC_DIR:./frontend-dist}}
    dev-origins: ${NEXTALLOC_CORS_ORIGINS:${PRAGATI_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}}
    uploads:
      dir: ${NEXTALLOC_UPLOADS_DIR:${PRAGATI_UPLOADS_DIR:./data/uploads}}
  rate-limit:
    login-per-minute: ${NEXTALLOC_RATE_LIMIT_LOGIN_PER_MINUTE:${PRAGATI_RATE_LIMIT_LOGIN_PER_MINUTE:8}}
  scoring:
    experimental-related-skills: ${NEXTALLOC_SCORING_EXPERIMENTAL_RELATED_SKILLS:${PRAGATI_SCORING_EXPERIMENTAL_RELATED_SKILLS:false}}

# Backward-compatibility alias block for legacy configurations
pragati:
  jwt:
    secret: ${NEXTALLOC_JWT_SECRET:${PRAGATI_JWT_SECRET:nextalloc-sih25033-demo-signing-secret-0123456789abcdef}}
    expiry-minutes: 720
  ai:
    service-url: ${NEXTALLOC_AI_URL:${PRAGATI_AI_URL:http://127.0.0.1:8000}}
    timeout-seconds: 30
  optimizer:
    timeout-seconds: 180
    max-wall-seconds: 120
  web:
    static-dir: ${NEXTALLOC_STATIC_DIR:${PRAGATI_STATIC_DIR:./frontend-dist}}
    dev-origins: ${NEXTALLOC_CORS_ORIGINS:${PRAGATI_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}}
    uploads:
      dir: ${NEXTALLOC_UPLOADS_DIR:${PRAGATI_UPLOADS_DIR:./data/uploads}}
  rate-limit:
    login-per-minute: ${NEXTALLOC_RATE_LIMIT_LOGIN_PER_MINUTE:${PRAGATI_RATE_LIMIT_LOGIN_PER_MINUTE:8}}
  scoring:
    experimental-related-skills: ${NEXTALLOC_SCORING_EXPERIMENTAL_RELATED_SKILLS:${PRAGATI_SCORING_EXPERIMENTAL_RELATED_SKILLS:false}}

logging:
  level:
    root: INFO
    in.nextalloc: INFO
    in.pragati: INFO
